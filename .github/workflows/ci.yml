name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        # Paths, drive letters and child processes behave differently on Windows.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The same npm as development: package.json sets an allowScripts policy.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests (real browser, video and voice)
    runs-on: ubuntu-latest
    # Several real videos are made; a 4-core runner takes a while.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The free Kokoro voice downloads its model (~90 MB) on first use.
      - name: Cache the Kokoro voice model
        uses: actions/cache@v6
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-${{ hashFiles('package-lock.json') }}
          restore-keys: kokoro-
      # Print each test as it finishes, so a slow run shows where it is.
      - run: npm run test:integration -- --reporter=verbose
      # The full flow with AI answers recorded once (engine/tests/fixtures/ai-answers/): no key, no cost.
      - run: npm run test:e2e -- --reporter=verbose

  package:
    name: npm package and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run build
      - name: Install the package in an empty folder and run it
        run: |
          npm pack ./dist/app-story --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/app-story-*.tgz
          npx app-story new demo --url http://localhost:3000
          npx app-story list | grep demo
      - name: Build the Docker image and run it
        run: |
          docker build -t app-story .
          docker run --rm app-story --version
      # The GitHub Action (action.yml), on the image just built: the practice app with a saved
      # plan whose every step has narration, so it needs no AI key.
      - name: Start the practice app, with a saved plan for it
        run: |
          node engine/tests/example-app/server.mjs &
          mkdir -p products/example.plans
          cp engine/tests/fixtures/create-project.plan.yaml products/example.plans/create-project.yaml
          for i in $(seq 1 50); do curl -sf http://localhost:4310/health > /dev/null && break; sleep 0.2; done
      - name: "Action: check the saved plan still works"
        uses: ./
        with:
          products: example
          command: test
          image: app-story
      - name: "Action: make its video again"
        uses: ./
        with:
          products: example
          image: app-story
          upload: "false"
      - run: ls -l output/example/*.mp4 output/example/*.srt
