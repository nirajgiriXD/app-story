name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The same npm as development: package.json sets an allowScripts policy.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests (real browser, video and voice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The free Kokoro voice downloads its model (~90 MB) on first use.
      - name: Cache the Kokoro voice model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-${{ hashFiles('package-lock.json') }}
          restore-keys: kokoro-
      - run: npm run test:integration
