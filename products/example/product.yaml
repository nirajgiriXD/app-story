version: 1

product:
  id: example
  name: Projectly
  description: A lightweight project tracker for small teams.
  base_url: http://localhost:4310
  start_path: /projects

browser:
  # 16:9 viewport rendered at 1.2x, so the recording is a sharp 1920x1080 with comfortably large UI.
  viewport:
    width: 1600
    height: 900
  device_scale_factor: 1.2
  allowed_domains:
    - localhost:4310
  locale: en-US
  timezone: UTC

authentication:
  strategy: form
  login_path: /login
  username_env: EXAMPLE_APP_USER
  password_env: EXAMPLE_APP_PASSWORD
  username_label: Email
  password_label: Password
  submit_text: Sign in
  success_url_contains: /projects

demo:
  default_language: en
  default_duration: 60
  default_resolution: 1080p
  template: modern-saas
  audience: New Projectly users

branding:
  primary_color: "#4F46E5"
  accent_color: "#0F172A"
  font: Inter

providers:
  ai:
    provider: anthropic
    # model: claude-opus-5-5      # leave out to use the provider default
    effort: high
    max_iterations: 30
  # Optional. Only used if the primary provider fails, and always recorded in metadata.
  # ai_fallback:
  #   provider: openai
  #   model: gpt-5
  tts:
    provider: kokoro            # free voice that runs on this computer, no API key
    # voice: marin

safety:
  environment: demo
  # Everything below defaults to false; listed here for visibility.
  allow:
    delete: false
    payments: false
    emails: false
    publishing: false
    account_settings: false
    invite_users: false
